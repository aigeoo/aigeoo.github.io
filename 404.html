<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الصفحة غير موجودة — WatchCom Security</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --brand-red:#C8102E; --brand-red-hover:#A50D26; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
    background:#0F1B2D; color:#E6EAF1; line-height:1.75;
    font-family:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  }
  .wrap { max-width:34rem; text-align:center; }
  .code { direction:ltr; unicode-bidi:isolate; font-size:clamp(4rem,14vw,7rem); font-weight:700; line-height:1; color:var(--brand-red); }
  h1 { font-size:clamp(1.5rem,4vw,2rem); margin:1.5rem 0 0; color:#fff; line-height:1.4; }
  p { color:rgba(230,234,241,.75); margin:1rem 0 0; }
  .btn {
    display:inline-block; margin-top:2.25rem; background:var(--brand-red); color:#fff;
    font-weight:700; text-decoration:none; padding:.9rem 1.75rem; border-radius:.5rem;
    transition:background-color .2s ease;
  }
  .btn:hover { background:var(--brand-red-hover); }
  .rule { width:3rem; height:4px; background:var(--brand-red); border-radius:999px; margin:1.75rem auto 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="rule"></div>
    <h1>لم نجد الصفحة التي تبحثون عنها</h1>
    <p>ربّما تغيّر عنوانها أو حُذفت. يمكنكم العودة إلى الصفحة الرئيسية أو التواصل معنا مباشرةً.</p>
    <a class="btn" href="/">العودة إلى الرئيسية</a>
  </div>
</body>
</html>
