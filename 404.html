<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>الصفحة غير موجودة — WatchCom Security</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root { --brand-red:#C8102E; --brand-red-hover:#A50D26; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 1.25rem;
      padding: clamp(1.5rem, 6vw, 4rem);
      text-align: center;
      background: #0A0F1A;
      color: #E6EAF1;
      font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
      line-height: 1.75;
    }
    .code {
      direction: ltr;
      unicode-bidi: isolate;
      font-size: clamp(3.5rem, 14vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: var(--brand-red);
      margin: 0;
    }
    h1 { font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 800; margin: 0; }
    p { margin: 0; color: #94A3B8; max-width: 42ch; margin-inline: auto; }
    a {
      justify-self: center;
      display: inline-block;
      margin-block-start: .5rem;
      background: var(--brand-red);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      padding: .7rem 1.4rem;
      transition: background-color .15s;
    }
    a:hover { background: var(--brand-red-hover); }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>

<body>
  <p class="code">404</p>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>ربّما تغيّر الرابط أو حُذفت الصفحة. يمكنك الرجوع إلى معرض التصاميم.</p>
  <!-- Absolute path: this repo is a user site, so the gallery is always at the root. -->
  <a href="/">جميع التصاميم</a>
</body>
</html>
